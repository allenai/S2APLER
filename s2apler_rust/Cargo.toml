[package]
name = "s2apler_rust"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_s2apler_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# Same PyO3, rust-numpy and rayon versions as s2and's extension.
pyo3 = { version = "0.24.2" }
numpy = "0.24"
rayon = "1.10"
# s2and's extension hashes with aHash too.
ahash = "0.8"

# Worker threads that allocate in parallel contend for glibc malloc arenas.
# Musl wheels keep the system allocator (inherited from s2and's setup).
# Linux aarch64 wheels keep it too: the manylinux2014 cross GCC cannot build mimalloc.
# macOS keeps it too: mimalloc there stores its thread heap in a fixed, reserved TLS slot, so
# a second static copy in the process (s2and's extension) shares the slot and both crash.
# Keep this cfg equal to the global allocator's cfg in src/lib.rs.
[target.'cfg(not(any(target_env = "musl", target_os = "macos", all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
sha2 = "0.10"
