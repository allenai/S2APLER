[project]
name = "s2apler"
version = "0.3.0"
description = "S2APLER: Semantic Scholar (S2) Agglomeration of Papers with Low Error Rate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Allen Institute for Artificial Intelligence" }
]
keywords = ["clustering", "papers", "semantic-scholar", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # s2and supplies the native LightGBM scorer and sets the numeric stack versions below.
    "s2and==1.0.0b8",
    "numpy>=2,<2.3",
    "scikit-learn==1.9.0",
    "text-unidecode==1.3",
    "requests>=2.32,<3",
    "hyperopt==0.3.0",
    "pandas>=2.2.2,<3",
    "lightgbm==4.7.0",
    "fastcluster>=1.3,<2",
    "shap>=0.51,<1",
    "matplotlib>=3.11.1,<4",
    "seaborn>=0.12,<0.14",
    "tqdm>=4.69,<5",
    "jellyfish>=1.2.1,<2",
    "pylatexenc==2.10",
    "awscli>=1.27.12",
]

[project.optional-dependencies]
dev = [
    "pytest==7.2.0",
    "pytest-cov==4.0.0",
    "flake8==5.0.4",
    "black==22.10",
    "click==8.0.4",
    "ty==0.0.99",
    "pydantic==1.10.2",
]

[project.urls]
Homepage = "https://github.com/allenai/S2APLER"
Repository = "https://github.com/allenai/S2APLER"
Issues = "https://github.com/allenai/S2APLER/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s2apler"]

[tool.uv]
dev-dependencies = [
    "pytest==7.2.0",
    "pytest-cov==4.0.0",
    "flake8==5.0.4",
    "black==22.10",
    "click==8.0.4",
    "ty==0.0.99",
    "pydantic==1.10.2",
]

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=s2apler --cov-report=term-missing"

[tool.ty.src]
include = ["s2apler", "tests"]

[[tool.ty.overrides]]
# timo_interface exists only inside the TIMO harness that runs this integration test.
include = ["s2apler/timo/integration_test.py"]

[tool.ty.overrides.rules]
import-not-found = "ignore"

[tool.coverage.run]
source = ["s2apler"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
